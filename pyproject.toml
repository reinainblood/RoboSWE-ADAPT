[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roboswe"
version = "0.1.0"
description = "RoboSWE-ADAPT: Adaptive Development of Action Programs Through Trials"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "roboswe/viewer/vendor/THREE-LICENSE.txt", "robot_session/michael/vendor/openarm/LICENSE", "robot_session/michael/vendor/wuji/LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy==2.2.5", "Pillow==11.2.1"]

[project.optional-dependencies]
modal = ["modal==1.5.5"]
notebook = ["anywidget>=0.11,<0.12"]
judge = ["av==18.1.0", "Pillow==11.2.1"]
michael = ["pandas==3.0.6", "pyarrow==25.0.1"]
test = ["pytest>=8"]

[project.scripts]
roboswe = "roboswe.cli:main"
roboswee = "roboswe.cli:main"

[tool.setuptools.packages.find]
include = ["roboswe*", "robot_session*", "pairing*"]
exclude = ["robot_session.tests*"]

[tool.setuptools.package-data]
roboswe = ["viewer/*.html", "viewer/*.js", "viewer/vendor/*.js", "viewer/vendor/*.txt"]
"roboswe.execution" = ["Dockerfile"]
robot_session = ["Dockerfile", "Dockerfile.dockerignore", "config.example.json", "compose.yaml", "requirements.txt", "README.md", "controls/*.jsonl"]
"robot_session.michael" = ["README.md", "BODY.md", "sources.json", "config.json", "ui/*", "vendor/**/*"]
